<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Séance Sport</title>
</head>
<body data-phase="idle">

<section id="home" class="screen active">
  <header class="home-head">
    <h1>Séance Sport</h1>
    <p id="summary" class="muted"></p>
  </header>

  <div id="modeSeg" class="seg"></div>
  <div id="sessionSeg" class="seg"></div>

  <ul id="exList" class="ex-list"></ul>

  <details class="settings">
    <summary>Réglages</summary>
    <div class="grid">
      <label>Travail (s)<input type="number" id="cfgWork" min="5" max="300" step="5"></label>
      <label>Repos (s)<input type="number" id="cfgRest" min="0" max="120" step="5"></label>
      <label>Pause de fin de tour (s)<input type="number" id="cfgRoundRest" min="0" max="600" step="5"></label>
      <label>Nombre de tours<input type="number" id="cfgRounds" min="1" max="12" step="1"></label>
      <label>Préparation (s)<input type="number" id="cfgPrep" min="0" max="60" step="5"></label>
    </div>
    <div class="grid">
      <label>Musique<select id="cfgMusic"><option value="off">Aucune</option><option value="electro">Électro (128)</option><option value="hiphop">Hip-hop (92)</option><option value="power">Power (140)</option></select></label>
      <label>Volume musique<input type="range" id="cfgMusicVol" min="0" max="100" step="5"></label>
    </div>
    <label class="check"><input type="checkbox" id="cfgVoice"> Voix</label>
    <label class="check"><input type="checkbox" id="cfgSound"> Bips</label>
    <label class="check"><input type="checkbox" id="cfgVibe"> Vibrations</label>
  </details>

  <button id="startBtn" class="big-btn">Commencer</button>
  <button id="histBtn" class="link-btn" style="margin-top:12px">Historique des séances</button>
  <div class="foot"><span id="verInfo" class="muted"></span><button id="updateBtn" class="link-btn">Mettre à jour l’application</button></div>
</section>

<section id="workout" class="screen">
  <div class="topbar">
    <button id="quitBtn" class="icon-btn" aria-label="Quitter">✕</button>
    <div class="top-info">
      <div id="roundInfo">Tour 1 / 4</div>
      <div id="exInfo" class="muted">Exercice 1 / 7</div>
    </div>
    <div class="top-total"><span class="muted">Reste</span><b id="totalLeft">--:--</b></div>
  </div>

  <div class="phase" id="phaseLabel">PRÉPARATION</div>

  <div class="ring-wrap">
    <svg viewBox="0 0 120 120" class="ring">
      <circle class="ring-bg" cx="60" cy="60" r="54"/>
      <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="54"/>
    </svg>
    <div class="count" id="count">10</div>
  </div>

  <h2 id="exName">Squats avec poids</h2>
  <p id="exSub" class="muted"></p>

  <div class="fig-wrap"><svg id="fig" viewBox="0 0 200 200"></svg></div>
  <p id="exTip" class="tip"></p>

  <div class="controls">
    <button id="prevBtn" class="ctl" aria-label="Précédent">⏮</button>
    <button id="pauseBtn" class="ctl main" aria-label="Pause">⏸</button>
    <button id="nextBtn" class="ctl" aria-label="Suivant">⏭</button>
  </div>
  <button id="musicBtn" class="chip">♪ Électro</button>
</section>

<section id="done" class="screen">
  <h1>Séance terminée</h1>
  <p id="doneText" class="muted"></p>
  <div id="distBox" class="distbox" hidden>
    <label for="distInput" class="muted">Distance parcourue (km)</label>
    <div class="distrow"><input id="distInput" type="text" inputmode="decimal" placeholder="ex. 4,5" autocomplete="off"><button id="distSave" class="link-btn">Enregistrer</button></div>
    <p id="distMsg" class="muted small"></p>
  </div>
  <button id="doneHist" class="link-btn" style="margin-top:18px">Voir l’historique</button>
  <button id="againBtn" class="big-btn">Accueil</button>
</section>

<section id="history" class="screen">
  <div class="topbar">
    <button id="histBack" class="icon-btn" aria-label="Retour">←</button>
    <div class="top-info">Historique</div>
    <div style="width:40px"></div>
  </div>
  <div id="histStats" class="stats"></div>
  <p class="muted small">Séances par semaine (8 dernières semaines)</p>
  <div id="histBars" class="bars"></div>
  <ul id="histList" class="hist-list"></ul>
  <div class="foot">
    <button id="histExport" class="link-btn">Exporter (CSV)</button>
    <button id="histClear" class="link-btn">Effacer l’historique</button>
    <p class="muted small">L’historique est conservé sur cet appareil (dans l’appli ou le navigateur utilisé).</p>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
